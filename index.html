<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menjadi Kepala Sekolah SMA yang Sukses</title>
<meta name="description" content="Presentasi 15 slide tentang kepemimpinan kepala sekolah SMA: lima pilar, kebiasaan efektif, dan rencana aksi 100 hari.">
<meta property="og:title" content="Menjadi Kepala Sekolah SMA yang Sukses">
<meta property="og:description" content="Presentasi kepemimpinan kepala sekolah SMA – lihat langsung di browser.">
<meta property="og:image" content="slides/slide-01.jpg">
<style>
  :root{
    --bg:#0e1a2e; --panel:#15243d; --ink:#eef2f7; --muted:#9fb0c6;
    --gold:#e3a82b; --line:#24375a; --btn:#1d3254; --btn-h:#27426d;
  }
  :root[data-theme="light"]{
    --bg:#f3f1ec; --panel:#ffffff; --ink:#1e2a38; --muted:#5b6675;
    --line:#e2ddd2; --btn:#ffffff; --btn-h:#f6efe0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
  h1{margin:0;font-size:clamp(20px,3.2vw,30px);line-height:1.2}
  h1 span{color:var(--gold)}
  .sub{margin:4px 0 0;color:var(--muted);font-size:14px}
  .actions{display:flex;flex-wrap:wrap;gap:8px}
  a.btn,button.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;
    background:var(--btn);color:var(--ink);border:1px solid var(--line);font:600 14px/1 inherit;
    text-decoration:none;cursor:pointer;font-family:inherit}
  a.btn:hover,button.btn:hover{background:var(--btn-h)}
  a.btn.primary{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
  .stage{position:relative;background:#000;border-radius:14px;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.35);aspect-ratio:16/9;user-select:none}
  .stage img{width:100%;height:100%;object-fit:contain;display:block}
  .nav{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;cursor:pointer;color:#fff;
    font-size:44px;opacity:0;transition:opacity .2s}
  .nav:hover,.nav:focus-visible{opacity:.9}
  .nav.prev{left:0;text-align:left;padding-left:18px;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
  .nav.next{right:0;text-align:right;padding-right:18px;background:linear-gradient(270deg,rgba(0,0,0,.35),transparent)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 18px;flex-wrap:wrap}
  .ctrl{display:flex;gap:8px;align-items:center}
  .count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:64px;text-align:center}
  .progress{flex:1;min-width:120px;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .thumbs button{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;
    background:var(--panel);position:relative}
  .thumbs button[aria-current="true"]{border-color:var(--gold)}
  .thumbs img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
  .thumbs span{position:absolute;left:6px;bottom:5px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;
    padding:2px 6px;border-radius:5px}
  footer{margin-top:26px;color:var(--muted);font-size:13px;line-height:1.6}
  footer a{color:var(--gold)}
  .stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
  .stage:fullscreen .nav{opacity:.0}
  @media (max-width:640px){ .nav{font-size:32px;opacity:.6} .actions{width:100%} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Menjadi Kepala Sekolah <span>SMA yang Sukses</span></h1>
      <p class="sub">15 slide · gunakan tombol ◀ ▶, panah keyboard, atau geser di HP</p>
    </div>
    <div class="actions">
      <a class="btn" id="office" target="_blank" rel="noopener">Buka di PowerPoint Online</a>
      <a class="btn" href="Menjadi%20Kepala%20Sekolah%20SMA%20yang%20Sukses.pdf" download>⬇ PDF</a>
      <a class="btn primary" href="Menjadi%20Kepala%20Sekolah%20SMA%20yang%20Sukses.pptx" download>⬇ PPTX</a>
    </div>
  </header>

  <div class="stage" id="stage">
    <img id="slide" alt="Slide 1" src="slides/slide-01.jpg">
    <button class="nav prev" id="prev" aria-label="Slide sebelumnya">‹</button>
    <button class="nav next" id="next" aria-label="Slide berikutnya">›</button>
  </div>

  <div class="bar">
    <div class="ctrl">
      <button class="btn" id="bprev" aria-label="Sebelumnya">◀</button>
      <span class="count" id="count">1 / 15</span>
      <button class="btn" id="bnext" aria-label="Berikutnya">▶</button>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div class="ctrl">
      <button class="btn" id="theme" aria-label="Ganti tema">◐</button>
      <button class="btn" id="fs">⛶ Layar penuh</button>
    </div>
  </div>

  <div class="thumbs" id="thumbs"></div>

  <footer>
    Materi dibagikan dengan lisensi <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.id" target="_blank" rel="noopener">CC BY-SA 4.0</a>.
    Atribusi foto tercantum di slide 15 dan di
    <a href="https://github.com/aseppanji-spec/kepala-sekolah-sukses#atribusi-gambar" target="_blank" rel="noopener">README repositori</a>.
  </footer>
</div>

<script>
(function(){
  var N = 15, i = 0;
  var pad = function(n){ return (n < 10 ? "0" : "") + n; };
  var src = function(k){ return "slides/slide-" + pad(k + 1) + ".jpg"; };
  var img = document.getElementById("slide"), thumbs = document.getElementById("thumbs");
  var raw = "https://raw.githubusercontent.com/aseppanji-spec/kepala-sekolah-sukses/main/Menjadi%20Kepala%20Sekolah%20SMA%20yang%20Sukses.pptx";
  document.getElementById("office").href = "https://view.officeapps.live.com/op/view.aspx?src=" + encodeURIComponent(raw);

  for (var k = 0; k < N; k++) {
    var b = document.createElement("button");
    b.innerHTML = '<img loading="lazy" alt="" src="' + src(k) + '"><span>' + (k + 1) + "</span>";
    b.setAttribute("aria-label", "Ke slide " + (k + 1));
    b.onclick = (function(k){ return function(){ go(k); window.scrollTo({top:0,behavior:"smooth"}); }; })(k);
    thumbs.appendChild(b);
  }
  function go(k){
    i = Math.max(0, Math.min(N - 1, k));
    img.src = src(i); img.alt = "Slide " + (i + 1);
    document.getElementById("count").textContent = (i + 1) + " / " + N;
    document.getElementById("prog").style.width = ((i + 1) / N * 100) + "%";
    [].forEach.call(thumbs.children, function(t, j){ t.setAttribute("aria-current", j === i); });
    if (i + 1 < N) { new Image().src = src(i + 1); }
    try { history.replaceState(null, "", "#" + (i + 1)); } catch(e) {}
  }
  var prev = function(){ go(i - 1); }, next = function(){ go(i + 1); };
  ["prev","bprev"].forEach(function(id){ document.getElementById(id).onclick = prev; });
  ["next","bnext"].forEach(function(id){ document.getElementById(id).onclick = next; });
  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
    if (e.key === "Home") go(0);
    if (e.key === "End") go(N - 1);
    if (e.key === "f" || e.key === "F") toggleFs();
  });
  var x0 = null, stage = document.getElementById("stage");
  stage.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener("touchend", function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); }
    x0 = null;
  });
  function toggleFs(){
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (stage.requestFullscreen) { stage.requestFullscreen(); }
    else if (stage.webkitRequestFullscreen) { stage.webkitRequestFullscreen(); }
  }
  document.getElementById("fs").onclick = toggleFs;

  var root = document.documentElement;
  try { var t = localStorage.getItem("theme"); if (t) root.setAttribute("data-theme", t); } catch(e) {}
  document.getElementById("theme").onclick = function(){
    var t = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    root.setAttribute("data-theme", t);
    try { localStorage.setItem("theme", t); } catch(e) {}
  };

  var h = parseInt(location.hash.slice(1), 10);
  go(isNaN(h) ? 0 : h - 1);
})();
</script>
</body>
</html>
